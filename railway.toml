[build]
dockerfilePath = "Dockerfile"
watchPatterns = ["packages/agent/**", "Dockerfile", "pnpm-lock.yaml"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
startCommand = "cd packages/agent && AGENT_PORT=${PORT:-3001} node dist/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
